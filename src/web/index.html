<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/brand/a-mark-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/brand/a-mark-192x192.png" />
    <link rel="apple-touch-icon" href="./assets/brand/a-mark-180x180.png" />
    <meta name="theme-color" content="#3f7d3f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Lexend:wght@600;700&family=Roboto:wght@500;700&display=swap" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Apetit Farm insights</title>
    <script>
      try {
        var t = localStorage.getItem("apetit.theme");
        var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <script type="module" src="./main.tsx" async></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
